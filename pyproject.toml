[project]
name = "llmrouter-free"
version = "0.1.0"
description = "Quota-aware LLM failover router built for free-tier providers: per-deployment rate limits, cooldowns, response cache, thread-safe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "fredbuildsai" }]
keywords = ["llm", "router", "failover", "rate-limit", "litellm", "free-tier"]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
llmrouter-free = "llmrouter_free.cli:app"

[project.urls]
Homepage = "https://github.com/fredbuildsai/llmrouter-free"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmrouter_free"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501: long explanatory comments/docstrings are intentional. B008: typer.Option()/Argument() in defaults is
# Typer's documented idiom.
ignore = ["E501", "B008"]
